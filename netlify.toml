# Configuración declarativa para Netlify
# Al vincular el repositorio en Netlify, estos valores se aplican automáticamente.

[build]
  publish = "_site"
  command = ""

# Cabeceras de seguridad y caché recomendadas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirección amigable opcional
[[redirects]]
  from = "/diptico"
  to = "/index.html"
  status = 301
