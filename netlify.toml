# Configuración declarativa para Netlify
# Al vincular el repositorio en Netlify, estos valores se aplican automáticamente.

[build]
  publish = "_site"
  command = ""

# Cabeceras de seguridad y caché recomendadas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cabeceras PWA para Service Worker y Manifiesto
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# Redirección amigable opcional
[[redirects]]
  from = "/diptico"
  to = "/index.html"
  status = 301
