<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="hopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>
  
  <!-- Base circular -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#2E7D32" stroke-width="1.2" opacity="0.8"/>
  
  <!-- Espiga de Cebada (Barley Ear) a la derecha -->
  <g fill="url(#goldGrad)" stroke="#78350F" stroke-width="0.5">
    <!-- Tallo curvado -->
    <path d="M 30 82 C 45 84, 76 75, 76 38" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Granos -->
    <path d="M 76 38 C 76 30, 71 24, 70 20 C 69 24, 72 32, 76 38 Z" />
    <path d="M 76 38 C 81 33, 83 26, 83 22 C 80 25, 77 32, 76 38 Z" />
    <path d="M 75 46 C 73 40, 68 34, 66 31 C 65 35, 70 41, 75 46 Z" />
    <path d="M 75 46 C 81 42, 84 36, 85 32 C 81 35, 77 41, 75 46 Z" />
    <path d="M 72 54 C 69 48, 64 43, 61 40 C 61 45, 66 50, 72 54 Z" />
    <path d="M 72 54 C 78 50, 81 44, 82 41 C 78 44, 74 49, 72 54 Z" />
    <path d="M 67 62 C 63 56, 58 52, 55 49 C 55 54, 60 59, 67 62 Z" />
    <path d="M 67 62 C 73 59, 76 53, 77 50 C 73 53, 69 58, 67 62 Z" />
    <path d="M 59 70 C 54 65, 49 61, 46 59 C 47 63, 52 67, 59 70 Z" />
    <path d="M 59 70 C 65 67, 68 62, 69 59 C 65 62, 61 66, 59 70 Z" />
    <!-- Barbas/Awns -->
    <path d="M 70 20 Q 66 12 60 8" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 83 22 Q 86 14 88 10" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 66 31 Q 60 22 53 17" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
    <path d="M 85 32 Q 91 25 94 20" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- Cono de Lúpulo (Hop Cone) a la izquierda -->
  <g fill="url(#hopGrad)" stroke="#14532D" stroke-width="0.6">
    <!-- Tallo y hoja superior -->
    <path d="M 40 22 C 45 20, 52 23, 56 28 C 52 28, 46 26, 40 22 Z" fill="#4ADE80" stroke="#166534" stroke-width="0.5"/>
    <path d="M 48 24 Q 44 28 42 34" fill="none" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Brácteas / Pétalos del lúpulo -->
    <path d="M 38 34 C 42 30, 48 30, 50 35 C 46 38, 40 38, 38 34 Z" />
    <path d="M 32 38 C 36 34, 42 35, 43 41 C 37 43, 33 42, 32 38 Z" />
    <path d="M 44 38 C 48 35, 54 36, 53 43 C 48 44, 44 42, 44 38 Z" />
    <path d="M 27 45 C 31 41, 38 42, 38 49 C 32 50, 27 48, 27 45 Z" />
    <path d="M 36 46 C 41 42, 47 43, 46 50 C 40 52, 36 50, 36 46 Z" />
    <path d="M 45 47 C 50 44, 55 46, 54 53 C 48 54, 44 51, 45 47 Z" />
    <path d="M 28 54 C 33 50, 39 52, 38 58 C 32 59, 28 57, 28 54 Z" />
    <path d="M 36 55 C 41 51, 47 53, 46 60 C 40 61, 36 59, 36 55 Z" />
    <path d="M 44 56 C 48 53, 53 55, 51 61 C 46 62, 43 59, 44 56 Z" />
    <!-- Punta inferior del cono -->
    <path d="M 34 63 C 38 59, 43 60, 42 67 C 38 68, 35 66, 34 63 Z" />
    <path d="M 39 68 C 42 66, 45 67, 44 72 C 41 73, 39 71, 39 68 Z" />
  </g>
  
  <!-- Estrella/Chispas botánicas de fermentación -->
  <circle cx="50" cy="50" r="1.5" fill="#FEF08A" opacity="0.9"/>
  <circle cx="43" cy="24" r="1" fill="#FEF08A" opacity="0.7"/>
  <circle cx="58" cy="74" r="1" fill="#FEF08A" opacity="0.7"/>
</svg>
