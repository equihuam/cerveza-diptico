<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Copa Cáliz de Cerveza Belga (Belgian Chalice / Trappist Goblet) -->
  <!-- Contorno del cáliz (Bowl contour) -->
  <path d="M 11.5 8 L 36.5 8 L 36.5 12.5 C 36.5 21.5, 29.5 27.5, 24 27.5 C 18.5 27.5, 11.5 21.5, 11.5 12.5 Z" stroke="currentColor" />
  
  <!-- Nivel de cerveza / Liquid fill -->
  <path d="M 12.3 13.5 Q 24 14.5 35.7 13.5 C 35.5 20.8, 29 26.5, 24 26.5 C 19 26.5, 12.5 20.8, 12.3 13.5 Z" fill="currentColor" fill-opacity="0.18" stroke="none" />
  
  <!-- Corona de espuma generosa / Dense Trappist foam head -->
  <path d="M 11.8 9.5 Q 24 7.2 36.2 9.5 L 35.7 13.5 Q 24 14.5 12.3 13.5 Z" fill="currentColor" fill-opacity="0.38" stroke="none" />

  <!-- Línea de menisco de espuma -->
  <path d="M 12.3 13.5 Q 24 14.5 35.7 13.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="0.5 2" />

  <!-- Tallo con nodo decorativo (Stem with decorative node) -->
  <line x1="24" y1="27.5" x2="24" y2="41.5" stroke="currentColor" stroke-width="2" />
  <circle cx="24" cy="34.5" r="1.6" fill="currentColor" />

  <!-- Pie / Base ancha del cáliz (Wide Chalice Foot) -->
  <line x1="13.5" y1="42" x2="34.5" y2="42" stroke="currentColor" stroke-width="2.4" />
</svg>
