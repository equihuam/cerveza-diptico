<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sin Conexión | Cultura Chelera</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/assets/img/icon-192.png">
  <meta name="theme-color" content="#2D3748">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1A202C;
      color: #F7FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #2D3748;
      border: 1px solid #4A5568;
      border-radius: 16px;
      padding: 2.5rem 1.75rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 1.6rem;
      color: #F6AD55;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    p {
      color: #E2E8F0;
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #C26910;
      color: #FFF;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #DD6B20;
    }
    .cached-tip {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #A0AEC0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🍺📡</span>
    <h1>Estás navegando sin conexión</h1>
    <p>No se pudo cargar este contenido porque tu dispositivo no tiene acceso a internet en este momento.</p>
    <button type="button" class="btn" onclick="window.location.reload()">🔄 Reintentar conexión</button>
    <p class="cached-tip">💡 La guía, catálogo y fichas que hayas abierto previamente continúan disponibles en la memoria de la aplicación.</p>
  </div>
</body>
</html>
