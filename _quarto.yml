project:
  type: website
  output-dir: _site
  resources:
    - assets/
    - data/
    - manifest.webmanifest
    - sw.js
    - offline.html
  render:
    - index.qmd
    - diptico.qmd
    - el-hervor-frio.qmd


website:
  title: "Cultura Chelera"
  description: "Guía interactiva mobile-first sobre familias de fermentación, bioquímica de cereales, catálogo y cata cervecera"
  site-url: "https://cerveza-mia.netlify.app"
  favicon: assets/img/favicon.svg
  open-graph:
    title: "Cultura Chelera"
    description: "Guía botánica, microbiológica y sensorial de la cerveza: familias, cereales, cristalería, catálogo y bitácora de cata."
    image: assets/img/cover.jpg
    site-name: "Cultura Chelera"
    locale: "es_MX"
  twitter-card:
    title: "Cultura Chelera"
    description: "Guía botánica, microbiológica y sensorial de la cerveza: familias, cereales, cristalería, catálogo y bitácora de cata."
    image: assets/img/cover.jpg
    card-style: summary_large_image
  navbar:
    background: "#2D3748"
    foreground: "#F7FAFC"
    search: false
    left:
      - text: "🍺 Guía Web"
        href: index.qmd
      - text: "🐇 El Hervor Frío"
        href: el-hervor-frio.qmd
      - text: "🖨️ Díptico Imprimible"
        href: diptico.qmd
      - text: "📋 Bitácora de Cata"
        href: assets/degustacion.html
      - text: "📚 Catálogo de Estilos"
        href: assets/catalogo.html
  page-footer:
    left: "© 2026 Miguel Equihua. Obra distribuida bajo licencia [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es)."
    right: "🍺 *Cultura Chelera* · Ciencia, botánica y fermentos"

format:
  html:
    theme: cosmo
    css: assets/css/diptico.css
    favicon: assets/img/favicon.svg
    toc: false
    page-layout: custom
    include-in-header:
      - text: |
          <link rel="manifest" href="/manifest.webmanifest">
          <meta name="theme-color" content="#2D3748">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Cultura Chelera">
          <link rel="apple-touch-icon" href="/assets/img/icon-192.png">
    include-after-body:
      - text: |
          <script src="/assets/js/pwa.js"></script>