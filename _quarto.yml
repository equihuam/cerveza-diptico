project:
  type: website
  output-dir: _site
  resources:
    - assets/
    - data/
  render:
    - index.qmd
    - diptico.qmd


website:
  title: "Cultura Chelera"
  description: "Guía interactiva mobile-first sobre familias de fermentación, bioquímica de cereales, catálogo y cata cervecera"
  site-url: "https://cerveza-mia.netlify.app"
  favicon: assets/img/favicon.svg
  open-graph:
    title: "Cultura Chelera"
    description: "Guía botánica, microbiológica y sensorial de la cerveza: familias, cereales, cristalería, catálogo y bitácora de cata."
    image: assets/img/cover.jpg
    site-name: "Cultura Chelera"
    locale: "es_MX"
  twitter-card:
    title: "Cultura Chelera"
    description: "Guía botánica, microbiológica y sensorial de la cerveza: familias, cereales, cristalería, catálogo y bitácora de cata."
    image: assets/img/cover.jpg
    card-style: summary_large_image
  navbar:
    background: "#2D3748"
    foreground: "#F7FAFC"
    search: false
    left:
      - text: "🍺 Guía Web"
        href: index.qmd
      - text: "🖨️ Díptico Imprimible"
        href: diptico.qmd
      - text: "📋 Bitácora de Cata"
        href: assets/degustacion.html
      - text: "📚 Catálogo de Estilos"
        href: assets/catalogo.html

format:
  html:
    theme: cosmo
    css: assets/css/diptico.css
    favicon: assets/img/favicon.svg
    toc: false
    page-layout: custom