<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMako" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#0f3a63"/>
      <stop offset="100%" stop-color="#041424"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2540" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="280" height="380" rx="16" fill="url(#bgMako)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="18" y="18" width="264" height="364" rx="12" fill="url(#sunGlow)" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="6,3"/>
  
  <text x="150" y="52" font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="15" fill="#bae6fd" text-anchor="middle" letter-spacing="3">MICROCERVECERÍA DE XALAPA</text>
  <line x1="45" y1="62" x2="255" y2="62" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Tiburón Mako Silhouette -->
  <g transform="translate(150, 150)">
    <circle r="64" fill="#06192d" stroke="#38bdf8" stroke-width="2"/>
    <!-- Olas estilizadas -->
    <path d="M -50 30 Q -25 15 0 30 Q 25 45 50 30" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M -45 42 Q -20 28 5 42 Q 30 56 45 42" fill="none" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Silueta Mako -->
    <path d="M -42 8 C -25 -22 18 -26 44 2 C 32 14 10 16 -12 18 C -26 20 -36 16 -42 8 Z" fill="#38bdf8"/>
    <!-- Aleta dorsal -->
    <polygon points="-8,-12 8,-36 12,-10" fill="#7dd3fc"/>
    <!-- Aleta pectoral -->
    <polygon points="-4,6 6,24 -12,14" fill="#0284c7"/>
    <!-- Ojo -->
    <circle cx="28" cy="2" r="2.5" fill="#fff"/>
  </g>
  
  <text x="150" y="245" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">TIBURÓN MAKO</text>
  <text x="150" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AMERICAN PALE ALE</text>
  
  <rect x="50" y="288" width="200" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#e0f2fe" text-anchor="middle">5.8% Alc. Vol. • 42 IBU • Cascade / Centennial</text>
  
  <line x1="50" y1="334" x2="250" y2="334" stroke="#0284c7" stroke-width="1"/>
  <text x="150" y="354" font-family="'Cinzel', Georgia, serif" font-size="10" fill="#7dd3fc" text-anchor="middle">AGUA DE MANANTIAL • COFRE DE PEROTE</text>
  <text x="150" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">VERACRUZ, MÉXICO</text>
</svg>